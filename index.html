<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payslip Calculator - Teleperformance Portugal (Google)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Payslip Calculator</h1>
            <p>Teleperformance Portugal (Google Project) | Created by Rafael Virgens</p>
        </header>

        <div class="main-content">
            <!-- Form Section -->
            <div class="form-section">
                <h2>Employee & Shift Details</h2>
                
                <div class="input-group">
                    <label for="month">Month:</label>
                    <select id="month">
                        <option value="January">January</option>
                        <option value="February">February</option>
                        <option value="March">March</option>
                        <option value="April">April</option>
                        <option value="May">May</option>
                        <option value="June">June</option>
                        <option value="July">July</option>
                        <option value="August">August</option>
                        <option value="September">September</option>
                        <option value="October" selected>October</option>
                        <option value="November">November</option>
                        <option value="December">December</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="baseSalary">Contract Base Salary (EUR):</label>
                    <input type="number" id="baseSalary" value="938.00" step="0.01">
                </div>

                <div class="input-group">
                    <label for="bonus">Monthly Productivity Bonus (EUR):</label>
                    <input type="number" id="bonus" value="0.00" step="0.01">
                </div>

                <div class="input-group">
                    <label for="duodecimos">Duodecimos (Holiday & Christmas):</label>
                    <select id="duodecimos">
                        <option value="NO">NO</option>
                        <option value="YES">YES</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="shift">Shift Option:</label>
                    <select id="shift">
                        <option value="1">1 - 21:00 to 06:00 (Span: 9h | Work: 8h | Lunch: 1h)</option>
                        <option value="2">2 - 23:00 to 08:00 (Span: 9h | Work: 8h | Lunch: 1h)</option>
                        <option value="3">3 - 15:00 to 00:00 (Span: 9h | Work: 8h | Lunch: 1h)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="workingDays">Total Working Days [Standard: 22]:</label>
                    <input type="number" id="workingDays" value="22">
                </div>

                <div class="input-group">
                    <label for="monThuNights">Night Shifts (Mon-Thu):</label>
                    <input type="number" id="monThuNights" value="0">
                </div>

                <div class="input-group">
                    <label for="friNights">Night Shifts (Friday):</label>
                    <input type="number" id="friNights" value="0">
                </div>

                <div class="input-group">
                    <label for="satNights">Night Shifts (Saturday):</label>
                    <input type="number" id="satNights" value="0">
                </div>

                <div class="input-group">
                    <label for="sunNights">Night Shifts (Sunday):</label>
                    <input type="number" id="sunNights" value="0">
                </div>

                <div class="input-group">
                    <label for="irsPercent">IRS Withholding Tax Percentage (%):</label>
                    <input type="number" id="irsPercent" value="0.0" step="0.1">
                </div>

                <div class="button-group">
                    <button id="btnCalculate" class="btn btn-calc">Calculate Payslip</button>
                    <button id="btnClear" class="btn btn-clear">Clear</button>
                    <button id="btnExportPDF" class="btn btn-pdf">Export PDF</button>
                </div>
            </div>

            <!-- Output Section -->
            <div class="output-section">
                <h2>Payslip Output</h2>
                <pre id="output">Click "Calculate Payslip" to generate the statement.</pre>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
